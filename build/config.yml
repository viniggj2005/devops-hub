# When you update `info`, run `wails3 task common:update:build-assets` to regenerate the build assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

info:
  companyName: "Vinicius Gabriel Graupmann Juraszek"
  productName: "Devops Hub"
  productIdentifier: "com.viniggj2005.devopshub"
  description: "Devops Hub Application"
  copyright: "Vinicius Gabriel Graupmann Juraszek"
  comments: "Devops Hub Application"
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
