name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.34

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            extra_tags: gtk3
            wails_command: build
            asset: devops-hub_linux_amd64_gtk3
          - os: ubuntu-24.04
            extra_tags: ""
            wails_command: build
            asset: devops-hub_linux_amd64
          - os: windows-latest
            extra_tags: ""
            wails_command: package
            asset: devops-hub_windows_amd64.exe
            installer_asset: devops-hub_windows_amd64_setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux Deps (GTK3 / WebKitGTK 4.1)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Linux Deps (GTK4 / WebKitGTK 6.0)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $nsisDirectory = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisDirectory\makensis.exe")) { choco install nsis -y --no-progress }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDirectory

      - name: Install Wails
        run: go install ${{ matrix.extra_tags && format('-tags={0}', matrix.extra_tags) || '' }} github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build App
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          app_version="${GITHUB_REF_NAME#v}"
          wails3 ${{ matrix.wails_command }} ${{ matrix.extra_tags && format('EXTRA_TAGS={0}', matrix.extra_tags) || '' }} APP_VERSION="$app_version" GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
          mkdir -p release
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp bin/devops-hub.exe "release/${{ matrix.asset }}"
            cp bin/*-installer.exe "release/${{ matrix.installer_asset }}"
          else
            cp bin/devops-hub "release/${{ matrix.asset }}"
          fi
        shell: bash

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
