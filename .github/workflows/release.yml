name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.34

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            extra_tags: gtk3
            asset: devops-hub_linux_amd64
          - os: ubuntu-24.04
            extra_tags: ""
            asset: devops-hub_linux_amd64
          - os: windows-latest
            extra_tags: ""
            asset: devops-hub_windows_amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux Deps (GTK3 / WebKitGTK 4.1)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Linux Deps (GTK4 / WebKitGTK 6.0)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build App
        run: |
          if [ -n "${{ matrix.extra_tags }}" ]; then
            wails3 build EXTRA_TAGS=${{ matrix.extra_tags }}
          else
            wails3 build
          fi
          mkdir -p release
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp bin/devops-hub.exe "release/${{ matrix.asset }}"
          else
            cp bin/devops-hub "release/${{ matrix.asset }}"
          fi
        shell: bash

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
